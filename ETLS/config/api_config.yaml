# REST API extractor configuration — Alpha Vantage Market Status.
# Used by: APIExtractor.from_config("ETLS/config/api_config.yaml")
api:
  name: market_status_api
  base_url: "https://www.alphavantage.co/query?function=MARKET_STATUS&apikey=PD5ZTN95XPG3NXB1"
  method: GET
  records_path: markets         # top-level key in the Alpha Vantage response body

  auth:
    type: none                  # API key is embedded in the URL above
    # --- bearer example ---
    # type: bearer
    # token: ${API_TOKEN}
    # --- api_key example ---
    # type: api_key
    # key: ${API_KEY}
    # name: X-API-Key
    # in: header                # header | query
    # --- basic example ---
    # type: basic
    # username: ${API_USER}
    # password: ${API_PASSWORD}

  headers:
    Accept: application/json

  # no pagination — MARKET_STATUS returns a single-page response
  timeout: 30
  max_pages: 1
