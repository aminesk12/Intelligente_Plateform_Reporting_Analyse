# Database loader / extractor configuration.
# Used by: DatabaseLoader.from_config("ETLS/config/database_config.yaml", section="sqlite")

# ── SQLite (zero-config, great for local testing) ────────────────────────────
#sqlite:
#  name: local_sqlite
#  connection_url: "sqlite:///DATA/Output/etl_test.db"
#  table: etl_results        # overridden per-pipeline in the test
#  if_exists: replace        # drop & recreate on each test run
#  pool_pre_ping: false      # SQLite has no connection pooling

# ── Oracle "ETLS" database (load destination) ────────────────────────────────
# Requires the `oracledb` driver (see requirements.txt) — pure Python "thin"
# mode by default, no Oracle Instant Client needed.
# Used by: run_oracle_pipeline.py, and any DatabaseLoader.from_config(..., section="oracle")
oracle:
  name: oracle_etls
  drivername: oracle+oracledb
  host: ${ORACLE_HOST:localhost}
  port: ${ORACLE_PORT:1521}
  username: ${ORACLE_USER}
  password: ${ORACLE_PASSWORD}
  # Service-name connection (required for an Oracle multitenant PDB — a SID
  # only resolves the CDB root, e.g. "FREE"; the PDB, e.g. "FREEPDB1", is only
  # registered with the listener as a service name).
#  query_params:
 #   service_name: ${ORACLE_SERVICE_NAME:FREEPDB1}
#  # schema: table owner, only needed if it differs from ORACLE_USER — uncomment and set ORACLE_SCHEMA
#  #  schema: ${ORACLE_SCHEMA}
  table: etl_results        # overridden per-table by the caller
  if_exists: append         # "replace" drops & recreates; "append" inserts into an existing table
  pool_pre_ping: true

# ── PostgreSQL "PFE_DATABASE" (load destination) ──────────────────────────────
# Requires the `psycopg2-binary` driver (see requirements.txt).
# Used by: run_postgres_pipeline.py, and any DatabaseLoader.from_config(..., section="postgres")
postgres:
  name: postgres_pfe
  drivername: postgresql+psycopg2
  host: ${POSTGRES_HOST:localhost}
  port: ${POSTGRES_PORT:5432}
  username: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: ${POSTGRES_DB:PFE_DATABASE}
  # schema: table owner, only needed if it differs from the default "public" — uncomment and set POSTGRES_SCHEMA
  #  schema: ${POSTGRES_SCHEMA}
  table: etl_results        # overridden per-table by the caller
  if_exists: append         # "replace" drops & recreates; "append" inserts into an existing table
  pool_pre_ping: true

# ── Other targets — assemble from parts the same way as "oracle" above ───────
# Driver reference (install the matching package — see requirements.txt):
#   PostgreSQL : postgresql+psycopg2://...
#   MySQL      : mysql+pymysql://...
#   SQL Server : mssql+pyodbc://...?driver=ODBC+Driver+18+for+SQL+Server
#   Oracle     : oracle+oracledb://...
#   SQLite     : sqlite:///path/to/file.db
