# Database loader / extractor configuration.
# Used by: DatabaseLoader.from_config("ETLS/config/database_config.yaml", section="sqlite")

# ── SQLite (zero-config, great for local testing) ────────────────────────────
#sqlite:
#  name: local_sqlite
#  connection_url: "sqlite:///DATA/Output/etl_test.db"
#  table: etl_results        # overridden per-pipeline in the test
#  if_exists: replace        # drop & recreate on each test run
#  pool_pre_ping: false      # SQLite has no connection pooling

# ── Production Oracle DWH (requires oracledb driver) ─────────────────────────
#
# Option B — assemble from parts (uncomment and remove connection_url above):
#   drivername: postgresql+psycopg2
#   host: ${DB_HOST:localhost}
#   port: 5432
#   database: ${DB_NAME}
#   username: ${DB_USER}
#   password: ${DB_PASSWORD}
#
# Driver reference (install the matching package — see requirements.txt):
#   PostgreSQL : postgresql+psycopg2://...
#   MySQL      : mysql+pymysql://...
#   SQL Server : mssql+pyodbc://...?driver=ODBC+Driver+18+for+SQL+Server
#   Oracle     : oracle+oracledb://...
#   SQLite     : sqlite:///path/to/file.db
