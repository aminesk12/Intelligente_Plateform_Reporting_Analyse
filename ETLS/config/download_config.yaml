# Remote file download jobs for Data_Downloader.py.
# Each job is streamed via HTTP(S) to a local path under DATA/ and skipped on
# rerun unless `overwrite: true` (same idempotent-rerun pattern the loaders use).
#
# Supported extensions -> default destination folder (used when `dest` is omitted):
#   .xlsx / .xls / .xlsm -> DATA/Excel
#   .db / .sqlite / .sqlite3 -> DATA/database
#   .json -> DATA/API

downloads: []
